services:
  repowise:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Coolify: expose via DOMAIN, not published host ports. The proxy needs to
    # reach the container: point the domain at internal port 3000 (Web UI).
    # The API (7337) stays internal — the frontend reaches it via localhost.
    # (Removed the old "ports:" mapping, which bypasses the Coolify proxy.)
    # Expose the API (7337) and MCP server (7338) to the Coolify proxy so you
    # can route domains to them. Recommended: use a second domain for the MCP
    # (mcp.example.com) -> port 7338. The map below makes them reachable inside
    # the compose network; the proxy handles the public side.
    expose:
      - "7337"
      - "3000"
      - "7338"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:${PORT_BACKEND:-7337}/health', timeout=5); sys.exit(0)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    volumes:
      # The repository being indexed lives at /repo, and repowise writes it's
      # .repowise/ index (wiki.db + LanceDB) INSIDE that same dir. Persist /repo
      # so the index survives rebuilds on Coolify.
      - repowise-data:/repo
      # Optional: mount a pre-cloned checkout here instead of letting the
      # entrypoint clone REPOWISE_REPO_URL into /repo on first start.
      # - type: bind
      #   source: /path/to/repo   # host path — only if it exists on the server
      #   target: /repo
    environment:
      # DB lives alongside the vectors in the indexed repo. The entrypoint also
      # defaults REPOWISE_DB_URL to this when unset.
      - REPOWISE_DB_URL=sqlite+aiosqlite:////repo/.repowise/wiki.db
      - REPOWISE_REPO_URL=${REPOWISE_REPO_URL:-}
      - REPOWISE_HOST=0.0.0.0
      # SECURITY: Set this to enable API authentication (required for non-loopback)
      - REPOWISE_API_KEY=${REPOWISE_API_KEY:?Set REPOWISE_API_KEY for Docker deployments}

      # ---- LLM: explicitly use OpenRouter ----
      - REPOWISE_PROVIDER=openrouter
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY to use OpenRouter}
      - REPOWISE_MODEL=${REPOWISE_MODEL:-qwen/qwen3.7-flash}   # e.g. openai/gpt-5, x-ai/grok-4

      # ---- Embedder ----
      # openrouter needs a valid embedding model (few today); switch to "mock"
      # (lexical search, free), "gemini" or "openai" if you prefer.
      - REPOWISE_EMBEDDER=${REPOWISE_EMBEDDER:-openrouter}
      - REPOWISE_EMBEDDING_MODEL=${REPOWISE_EMBEDDING_MODEL:-google/gemini-embedding-001}

      # Kept for compatibility — not required when using OpenRouter
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped

volumes:
  repowise-data:
